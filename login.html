<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Sarwar's Family Dhaba</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff9ed;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.login-box{
  width:90%;
  max-width:400px;
  background:white;
  padding:35px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 8px 30px #0002;
}

h1{
  color:#073d32;
  margin-bottom:10px;
}

p{
  color:#66756f;
}

.auth-btn{
  display:block;
  width:100%;
  padding:15px;
  margin:15px 0;
  border:none;
  border-radius:10px;
  background:#073d32;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.auth-btn:hover{
  background:#0d5546;
}

.back{
  display:inline-block;
  margin-top:15px;
  color:#073d32;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="login-box">

  <h1>Welcome</h1>
  <p>Sarwar's Family Dhaba</p>

  <button class="auth-btn">Sign In</button>

  <button class="auth-btn">Sign Up</button>

  <a class="back" href="index.html">← Back to Website</a>

</div>

</body>
</html>
