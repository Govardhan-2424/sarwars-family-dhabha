<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Sarwar's Family Dhaba</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff9ed;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.login-box{
  width:90%;
  max-width:400px;
  background:white;
  padding:35px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 8px 30px #0002;
}

h1{
  color:#073d32;
  margin-bottom:10px;
}

p{
  color:#66756f;
}

.auth-btn{
  display:block;
  width:100%;
  padding:15px;
  margin:15px 0;
  border:none;
  border-radius:10px;
  background:#073d32;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.auth-btn:hover{
  background:#0d5546;
}

.back{
  display:inline-block;
  margin-top:15px;
  color:#073d32;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="login-box">

  <h1>Welcome</h1>
  <p>Sarwar's Family Dhaba</p>
  <input id="authEmail" type="email" placeholder="Email" required>

<input id="authPassword" type="password" placeholder="Password" required>

<p id="authMessage"></p>

  <button class="auth-btn" onclick="loginUser()">Sign In</button>

  <button class="auth-btn" onclick="signupUser()">Sign Up</button>

  <a class="back" href="index.html">← Back to Website</a>

</div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC_QweprQRiMpvHkwLka3qIw2x22PW89S4",
    authDomain: "sarwars-family-dhabha.firebaseapp.com",
    projectId: "sarwars-family-dhabha",
    storageBucket: "sarwars-family-dhabha.firebasestorage.app",
    messagingSenderId: "1041983017000",
    appId: "1:1041983017000:web:236cb6a36c6d414a4c251d",
    measurementId: "G-QSPS6M9NM4"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  window.signupUser = async function () {
    const email = document.getElementById("authEmail").value;
    const password = document.getElementById("authPassword").value;
    const message = document.getElementById("authMessage");

    try {
      await createUserWithEmailAndPassword(auth, email, password);
      message.textContent = "Sign Up successful!";
    } catch (error) {
      message.textContent = error.message;
    }
  };

  window.loginUser = async function () {
    const email = document.getElementById("authEmail").value;
    const password = document.getElementById("authPassword").value;
    const message = document.getElementById("authMessage");

    try {
      await signInWithEmailAndPassword(auth, email, password);
      message.textContent = "Sign In successful!";
    } catch (error) {
      message.textContent = error.message;
    }
  };
</script>
</body>
</html>
